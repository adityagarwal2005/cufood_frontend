<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUFood — Order Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#0a0a0a">
</head>
<body class="font-sans bg-cream text-ink antialiased">
  <header class="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-line">
    <div class="max-w-6xl mx-auto flex items-center justify-between px-6 sm:px-8 py-5">
      <a href="location-select.html" class="flex items-center gap-3">
        <span class="flex items-center justify-center w-9 h-9 rounded-full bg-ink text-white font-black text-sm">CU</span>
        <span class="flex flex-col leading-tight">
          <span class="text-lg font-black tracking-tightest text-ink">CUFOOD</span>
          <span class="text-[10px] font-semibold uppercase tracking-widest text-muted hidden sm:block">Order status</span>
        </span>
      </a>
      <div class="flex items-center gap-5">
        <a href="my-orders.html" class="text-xs font-bold uppercase tracking-wide text-ink hover:text-accent transition-colors duration-150">My orders</a>
        <a href="location-select.html" class="text-xs font-bold uppercase tracking-wide text-ink hover:text-accent transition-colors duration-150">&larr; Browse outlets</a>
      </div>
    </div>
  </header>

  <main class="relative overflow-hidden bg-white min-h-[calc(100vh-77px)]">
    <div class="relative max-w-lg mx-auto px-6 sm:px-8 py-10 sm:py-14">
      <div id="page-content">
        <p class="text-sm font-medium text-muted">Loading order...</p>
      </div>
    </div>
  </main>

  <footer class="relative border-t border-line bg-white">
    <div class="max-w-6xl mx-auto px-6 sm:px-8 py-10 flex flex-col sm:flex-row items-center justify-between gap-4">
      <a href="location-select.html" class="flex items-center gap-2.5">
        <span class="flex items-center justify-center w-8 h-8 rounded-full bg-ink text-white font-black text-xs">CU</span>
        <span class="flex flex-col leading-tight">
          <span class="text-sm font-black tracking-tightest text-ink">CUFOOD</span>
          <span class="text-[11px] font-medium text-muted">Live campus food availability</span>
        </span>
      </a>
      <p class="text-xs font-medium text-muted">© 2026 CUFood · Chandigarh University</p>
    </div>
  </footer>

  <script src="icons.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="order-status.js"></script>
</body>
</html>
