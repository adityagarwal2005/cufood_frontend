<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUFood — Choose a Location</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#0a0a0a">
</head>
<body class="font-sans bg-cream text-ink antialiased">
  <header class="sticky top-0 z-20 bg-cream/85 backdrop-blur-md border-b border-line">
    <div class="max-w-6xl mx-auto flex items-center justify-between px-6 sm:px-8 py-5">
      <a href="location-select.html" class="flex items-center gap-3">
        <span class="flex items-center justify-center w-9 h-9 rounded-full bg-accent text-white font-black text-sm">CU</span>
        <span class="flex flex-col leading-tight">
          <span class="text-lg font-black tracking-tightest text-ink">CUFOOD</span>
          <span class="text-xs font-semibold uppercase tracking-widest text-muted">CU Campus</span>
        </span>
      </a>
      <span id="account-nav" class="flex items-center gap-3 whitespace-nowrap"></span>
    </div>
  </header>

  <main class="relative min-h-[calc(100vh-77px)] px-6 py-14 sm:py-20 bg-cream overflow-hidden">
    <div class="relative max-w-3xl mx-auto">
      <div class="flex flex-col items-center text-center mb-10 sm:mb-14">
        <span class="inline-flex items-center gap-2 rounded-full border border-ink px-3.5 py-1.5 text-xs font-bold uppercase tracking-widest text-ink mb-5">
          <span class="relative flex w-2 h-2">
            <span class="absolute inline-flex w-full h-full rounded-full bg-accent opacity-70 animate-ping"></span>
            <span class="relative inline-flex w-2 h-2 rounded-full bg-accent"></span>
          </span>
          Live · CU Campus
        </span>
        <h1 class="text-3xl sm:text-4xl font-black tracking-tightest text-ink leading-[0.95]">Where are you<br class="hidden sm:block"> right now?</h1>
      </div>

      <div id="location-list" class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6">
        <div class="skel h-40 sm:h-44"></div>
        <div class="skel h-40 sm:h-44"></div>
      </div>

      <p class="text-sm sm:text-base text-muted max-w-md mx-auto text-center mt-8">Pick your spot on campus and see what's cooking — live availability, updated by the outlets themselves.</p>

      <div id="stat-bar" class="flex items-stretch justify-center divide-x divide-line border border-line rounded-2xl bg-cream-alt max-w-lg mx-auto mt-8">
        <div class="flex-1 px-4 py-5 text-center">
          <p id="stat-locations" class="text-2xl sm:text-3xl font-black text-ink tabular-nums">—</p>
          <p class="text-xs font-bold uppercase tracking-wide text-muted mt-0.5">Locations</p>
        </div>
        <div class="flex-1 px-4 py-5 text-center">
          <p id="stat-outlets" class="text-2xl sm:text-3xl font-black text-ink tabular-nums">—</p>
          <p class="text-xs font-bold uppercase tracking-wide text-muted mt-0.5">Outlets</p>
        </div>
        <div class="flex-1 px-4 py-5 text-center">
          <p id="stat-open" class="text-2xl sm:text-3xl font-black text-accent tabular-nums">—</p>
          <p class="text-xs font-bold uppercase tracking-wide text-muted mt-0.5">Open now</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="relative border-t border-line bg-cream">
    <div class="max-w-6xl mx-auto px-6 sm:px-8 py-10 flex flex-col sm:flex-row items-center justify-between gap-4">
      <a href="location-select.html" class="flex items-center gap-2.5">
        <span class="flex items-center justify-center w-8 h-8 rounded-full bg-accent text-white font-black text-xs">CU</span>
        <span class="flex flex-col leading-tight">
          <span class="text-sm font-black tracking-tightest text-ink">CUFOOD</span>
          <span class="text-xs font-medium text-muted">Live campus food availability</span>
        </span>
      </a>
      <div class="flex items-center gap-4">
        <a href="privacy-policy.html" class="text-xs font-medium text-muted hover:text-ink transition-colors duration-150">Privacy</a>
        <a href="terms.html" class="text-xs font-medium text-muted hover:text-ink transition-colors duration-150">Terms</a>
        <p class="text-xs font-medium text-muted">© 2026 CUFood · CU Campus</p>
      </div>
    </div>
  </footer>

  <script src="icons.js"></script>
  <script src="student-auth.js"></script>
  <script src="location-select.js"></script>
</body>
</html>
