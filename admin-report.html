<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUFood — Sales Report</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#0a0a0a">
</head>
<body class="font-sans bg-cream text-ink antialiased">
  <header class="sticky top-0 z-20 bg-cream/85 backdrop-blur-md border-b border-line">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-x-4 gap-y-2 px-6 sm:px-8 py-4 sm:py-5">
      <div class="flex items-center gap-3 flex-shrink-0">
        <img src="logo.png" alt="CU Food" class="h-8 sm:h-9 w-auto">
        <span class="text-xs font-semibold uppercase tracking-widest text-muted">Reports</span>
      </div>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
        <a href="admin-dashboard.html" class="text-xs font-bold uppercase tracking-wide text-ink hover:text-accent-deep transition-colors duration-150 whitespace-nowrap">&larr; Today</a>
        <button type="button" id="logout-btn" class="btn-secondary btn-sm">Log out</button>
      </div>
    </div>
  </header>

  <main class="relative overflow-hidden bg-cream min-h-[calc(100vh-77px)]">
    <div class="relative max-w-5xl mx-auto px-6 sm:px-8 py-10 sm:py-14">

      <section class="mb-8">
        <h1 class="text-2xl sm:text-3xl font-black tracking-tightest text-ink mb-1">Sales by outlet</h1>
        <p class="text-sm text-muted">Pick a date range, then open an outlet to see its day-by-day breakdown.</p>
      </section>

      <section class="bg-cream-alt border border-line rounded-2xl p-5 mb-8">
        <div class="flex flex-wrap items-end gap-4">
          <label class="flex flex-col gap-1.5">
            <span class="text-xs font-bold uppercase tracking-wide text-muted">From</span>
            <input type="date" id="start-date" class="rounded-xl border-2 border-line bg-cream px-3 py-2 text-sm font-semibold text-ink focus:outline-none focus:border-accent">
          </label>
          <label class="flex flex-col gap-1.5">
            <span class="text-xs font-bold uppercase tracking-wide text-muted">To</span>
            <input type="date" id="end-date" class="rounded-xl border-2 border-line bg-cream px-3 py-2 text-sm font-semibold text-ink focus:outline-none focus:border-accent">
          </label>
          <button type="button" id="apply-btn" class="rounded-xl bg-accent text-white font-bold text-sm px-5 py-2.5 hover:bg-accent-deep transition-colors duration-150">Show</button>
        </div>
        <div class="flex flex-wrap gap-2 mt-4" id="presets">
          <button type="button" data-days="0" class="chip">Today</button>
          <button type="button" data-days="6" class="chip">Last 7 days</button>
          <button type="button" data-days="29" class="chip">Last 30 days</button>
          <button type="button" data-month="1" class="chip">This month</button>
        </div>
      </section>

      <div id="page-content">
        <div class="h-28 skel rounded-2xl mb-4"></div>
        <div class="h-20 skel rounded-2xl"></div>
      </div>
    </div>
  </main>

  <script src="icons.js"></script>
  <script src="admin-report.js"></script>
</body>
</html>
