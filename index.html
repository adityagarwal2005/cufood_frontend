<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUFood — Outlets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#0a0a0a">
</head>
<body class="font-sans bg-cream text-ink antialiased">
  <header class="sticky top-0 z-20 bg-cream/85 backdrop-blur-md border-b border-line">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3 px-6 sm:px-8 py-5">
      <a href="location-select.html" class="flex items-center gap-3">
        <span class="flex items-center justify-center w-9 h-9 rounded-full bg-accent text-white font-black text-sm">CU</span>
        <span class="flex flex-col leading-tight">
          <span class="text-lg font-black tracking-tightest text-ink">CUFOOD</span>
          <span class="text-xs font-semibold uppercase tracking-widest text-muted hidden sm:block">CU Campus</span>
        </span>
      </a>
      <div class="flex flex-wrap items-center gap-5 sm:gap-7">
        <a href="location-select.html" id="location-indicator" class="text-xs font-bold uppercase tracking-wide text-ink hover:text-accent-deep transition-colors duration-150 whitespace-nowrap">Switch Location</a>
        <a href="my-orders.html" class="text-xs font-bold uppercase tracking-wide text-ink hover:text-accent-deep transition-colors duration-150 whitespace-nowrap">My Orders</a>
        <span id="account-nav" class="flex items-center gap-3 whitespace-nowrap"></span>
        <a href="restaurant-login.html" class="text-xs font-bold uppercase tracking-wide text-white bg-accent rounded-full px-4 py-2.5 hover:bg-accent-deep hover:text-ink transition-colors duration-150 whitespace-nowrap">Restaurant Login</a>
      </div>
    </div>
  </header>

  <main class="relative overflow-hidden bg-cream">
    <div class="relative max-w-6xl mx-auto px-6 sm:px-8 py-14 sm:py-24">
      <section class="relative mb-12">
        <p class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-muted mb-4">
          <span class="w-6 h-[2px] bg-accent"></span>
          CU Campus
        </p>
        <h1 id="hero-title" class="text-3xl sm:text-4xl font-black tracking-tightest text-ink leading-[0.92] mb-6">Restaurants</h1>
        <p id="hero-subtitle" class="text-base sm:text-xl text-muted max-w-xl leading-relaxed mb-3">Search a dish or browse every outlet.</p>
        <p id="outlet-stats" class="text-sm font-bold text-accent-deep"></p>
      </section>

      <div class="relative mb-16">
        <span class="absolute left-6 top-1/2 -translate-y-1/2 w-5 h-5 text-muted pointer-events-none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input
          type="text"
          id="search-input"
          placeholder="Search for restaurant or dish"
          autocomplete="off"
          class="w-full rounded-full border-2 border-line bg-cream-alt pl-14 pr-6 py-4 text-base font-medium text-ink placeholder:text-muted placeholder:font-normal focus:outline-none focus:border-accent focus:ring-4 focus:ring-accent-soft transition-all duration-150"
        >
      </div>

      <section id="search-results" class="hidden flex flex-col gap-3 mb-12"></section>

      <section id="restaurant-row-section">
        <div class="flex items-center justify-between gap-3 mb-6 pb-4 border-b border-line">
          <h2 class="text-xs font-bold uppercase tracking-widest text-ink">Outlets</h2>
          <button type="button" id="open-only-toggle" class="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wide bg-cream-alt text-ink border border-line rounded-full px-4 py-2 hover:border-ink transition-all duration-150">
            <span class="w-1.5 h-1.5 rounded-full bg-accent"></span>Open now
          </button>
        </div>
        <div id="restaurant-row" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div class="aspect-[16/10] sm:aspect-[2/1] skel"></div>
          <div class="aspect-[16/10] sm:aspect-[2/1] skel"></div>
          <div class="aspect-[16/10] sm:aspect-[2/1] skel hidden sm:block"></div>
          <div class="aspect-[16/10] sm:aspect-[2/1] skel hidden sm:block"></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="relative border-t border-line bg-cream">
    <div class="max-w-6xl mx-auto px-6 sm:px-8 py-10 flex flex-col sm:flex-row items-center justify-between gap-4">
      <a href="location-select.html" class="flex items-center gap-2.5">
        <span class="flex items-center justify-center w-8 h-8 rounded-full bg-accent text-white font-black text-xs">CU</span>
        <span class="flex flex-col leading-tight">
          <span class="text-sm font-black tracking-tightest text-ink">CUFOOD</span>
          <span class="text-xs font-medium text-muted">Live campus food availability</span>
        </span>
      </a>
      <div class="flex items-center gap-4">
        <a href="privacy-policy.html" class="text-xs font-medium text-muted hover:text-ink transition-colors duration-150">Privacy</a>
        <a href="terms.html" class="text-xs font-medium text-muted hover:text-ink transition-colors duration-150">Terms</a>
        <p class="text-xs font-medium text-muted">© 2026 CUFood · CU Campus</p>
      </div>
    </div>
  </footer>

  <script src="icons.js"></script>
  <script src="student-auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
