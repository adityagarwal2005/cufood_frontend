<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUFood — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#0a0a0a">
</head>
<body class="font-sans bg-cream text-ink antialiased">
  <header class="sticky top-0 z-20 bg-cream/85 backdrop-blur-md border-b border-line">
    <div class="max-w-6xl mx-auto flex items-center justify-between px-6 sm:px-8 py-5">
      <a href="index.html" class="flex items-center gap-3">
        <img src="logo.png" alt="CU Food" class="h-8 sm:h-9 w-auto">
        <span class="text-xs font-semibold uppercase tracking-widest text-muted hidden sm:block">CU Campus</span>
      </a>
      <a href="index.html" class="text-xs font-bold uppercase tracking-wide text-ink hover:text-accent-deep transition-colors duration-150 whitespace-nowrap">&larr; Back to CUFood</a>
    </div>
  </header>

  <main class="relative min-h-[calc(100vh-77px)] flex items-center justify-center p-6 bg-cream overflow-hidden">
    <div class="relative w-full max-w-sm">
      <div class="text-center mb-8">
        <h1 class="text-2xl sm:text-3xl font-black tracking-tightest text-ink mb-1.5">Sign in</h1>
        <p class="text-sm text-muted">You'll need an account to order — it's how the restaurant knows it's really you.</p>
      </div>

      <div class="bg-cream-alt border border-line rounded-2xl p-6 sm:p-7">
        <div class="flex items-center gap-1 bg-cream rounded-xl p-1 mb-5">
          <button type="button" id="mode-password-btn" class="flex-1 rounded-lg py-2 text-xs font-bold uppercase tracking-wide transition-all duration-150">Password</button>
          <button type="button" id="mode-otp-btn" class="flex-1 rounded-lg py-2 text-xs font-bold uppercase tracking-wide transition-all duration-150">Email code</button>
        </div>

        <div id="login-error" class="hidden text-sm font-medium text-error bg-error-soft rounded-xl px-4 py-3 mb-5"></div>
        <div id="login-notice" class="hidden text-sm font-medium text-success bg-success-soft rounded-xl px-4 py-3 mb-5"></div>

        <form id="login-form" class="flex flex-col gap-4">
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-muted" for="identifier">Username or email</label>
            <input type="text" id="identifier" autocomplete="username" required class="field">
          </div>

          <div id="password-field" class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-muted" for="password">Password</label>
            <div class="relative">
              <input type="password" id="password" autocomplete="current-password" class="field pr-11">
              <button type="button" id="password-toggle" tabindex="-1" class="absolute right-3.5 top-1/2 -translate-y-1/2 w-5 h-5 text-muted hover:text-accent-deep transition-colors duration-150"></button>
            </div>
          </div>

          <div id="otp-field" class="hidden flex-col gap-3">
            <button type="button" id="send-code-btn" class="btn-secondary w-full text-sm">Send me a code</button>
            <div id="otp-input-wrap" class="hidden flex-col gap-1.5">
              <label class="text-xs font-semibold text-muted" for="otp">6-digit code</label>
              <input type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="000000" class="field text-center tracking-[0.4em] font-bold">
              <button type="button" id="resend-code-btn" class="text-xs font-semibold text-accent-deep hover:underline self-start mt-1">Resend code</button>
            </div>
          </div>

          <button type="submit" id="login-submit" class="btn-primary w-full text-sm mt-1">Sign in</button>
        </form>
      </div>

      <p class="text-sm text-muted text-center mt-6">New to CUFood? <a href="student-register.html" class="text-accent-deep font-bold hover:underline">Create an account</a></p>
    </div>
  </main>

  <script src="icons.js"></script>
  <script src="student-auth.js"></script>
  <script src="student-login.js"></script>
</body>
</html>
