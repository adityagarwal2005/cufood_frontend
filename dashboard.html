<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUFood — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="dashboard-manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#d9531e">
</head>
<body class="font-sans bg-cream text-ink antialiased">
  <header class="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-line shadow-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between px-6 sm:px-8 py-4">
      <a href="index.html" class="flex items-center gap-3">
        <span class="flex items-center justify-center w-9 h-9 rounded-xl bg-gradient-to-br from-accent to-accent-deep text-white font-extrabold text-sm shadow-accent-glow">CU</span>
        <span class="flex flex-col leading-tight">
          <span class="text-lg font-extrabold tracking-tight text-ink">CUFood</span>
          <span class="text-xs font-medium text-muted hidden sm:block">Owner Dashboard</span>
        </span>
      </a>
    </div>
  </header>

  <main class="relative overflow-hidden bg-gradient-to-br from-cream via-cream to-accent-soft/30 min-h-[calc(100vh-69px)]">
    <div class="fixed inset-0 opacity-[0.35] pointer-events-none [background-image:radial-gradient(circle,#d9531e_1px,transparent_1px)] [background-size:28px_28px] [mask-image:radial-gradient(ellipse_80%_60%_at_50%_0%,black,transparent)]"></div>
    <div class="fixed -top-24 -right-20 w-96 h-96 rounded-full bg-accent-soft blur-3xl opacity-60 pointer-events-none"></div>
    <div class="fixed bottom-0 -left-24 w-80 h-80 rounded-full bg-accent/10 blur-3xl pointer-events-none"></div>
    <div class="fixed top-1/2 right-0 w-72 h-72 rounded-full bg-accent-deep/10 blur-3xl pointer-events-none"></div>
    <div class="relative max-w-4xl mx-auto px-6 sm:px-8 py-10 sm:py-12">
      <div id="page-content">
        <div class="h-32 rounded-2xl bg-stone-200/70 animate-pulse mb-8"></div>
        <div class="h-48 rounded-2xl bg-stone-200/70 animate-pulse mb-8"></div>
        <div class="h-40 rounded-2xl bg-stone-200/70 animate-pulse"></div>
      </div>
    </div>
  </main>

  <script src="icons.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
