<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUFood — Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#0a0a0a">
</head>
<body class="font-sans bg-cream text-ink antialiased">
  <main class="relative min-h-screen flex items-center justify-center p-6 bg-cream overflow-hidden">
    <div class="relative w-full max-w-sm">
      <div class="text-center mb-8">
        <span class="inline-flex items-center justify-center w-11 h-11 rounded-full bg-accent text-white font-black text-base mb-4">CU</span>
        <h1 class="text-2xl font-black tracking-tightest text-ink mb-1.5">Admin</h1>
        <p class="text-sm text-muted">Platform analytics — not the owner dashboard.</p>
      </div>

      <div class="bg-cream-alt border border-line rounded-2xl p-6 sm:p-7">
        <div id="login-error" class="hidden text-sm font-medium text-error bg-error-soft rounded-xl px-4 py-3 mb-5"></div>

        <form id="login-form" class="flex flex-col gap-4">
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-muted" for="identifier">Email or username</label>
            <input type="text" id="identifier" autocomplete="username" required class="field">
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-muted" for="password">Password</label>
            <div class="relative">
              <input type="password" id="password" autocomplete="current-password" required class="field pr-11">
              <button type="button" id="password-toggle" tabindex="-1" class="absolute right-3.5 top-1/2 -translate-y-1/2 w-5 h-5 text-muted hover:text-accent-deep transition-colors duration-150"></button>
            </div>
          </div>

          <button type="submit" id="login-submit" class="btn-primary w-full text-sm mt-1">Sign in</button>
        </form>
      </div>
    </div>
  </main>

  <script src="icons.js"></script>
  <script src="admin-login.js"></script>
</body>
</html>
